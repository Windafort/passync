server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    #
    # NOTE on nginx `add_header` inheritance:
    # A location block does NOT inherit the server-level add_header directives
    # once it defines even one of its own. So the security headers are repeated
    # in every location that carries cache headers, ensuring ALL responses (incl.
    # internally-redirected /index.html) carry the full set.
    #

    # Gzip the small JS/CSS bundles and HTML.
    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml application/wasm;

    # The app is a single-page build served from the root: always fall back
    # to index.html so any (future) deep link still loads.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options nosniff                  always;
        add_header X-Frame-Options         SAMEORIGIN               always;
        add_header Referrer-Policy         no-referrer-when-downgrade always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
    }

    # Immutable, long-lived cache for Vite's hashed assets.
    location /assets/ {
        try_files $uri =404;

        add_header Cache-Control          "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff                                always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
    }

    # index.html must never be cached so new releases load immediately.
    # (Root "/" and all deep links internally redirect here, so this block
    #  governs the headers on every HTML response.)
    location = /index.html {
        add_header Cache-Control          "no-cache, no-store, must-revalidate"  always;
        add_header X-Content-Type-Options nosniff                                always;
        add_header X-Frame-Options         SAMEORIGIN                            always;
        add_header Referrer-Policy         no-referrer-when-downgrade            always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
    }
}
